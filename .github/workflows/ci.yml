name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this workflow reads the repository and writes nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  # Linters are pinned. A gate whose verdict depends on the day you run it is
  # not a gate: a new clippy lint must be a deliberate upgrade, not a surprise
  # red build on an unchanged commit.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a tag: a tag is a moving pointer someone
      # else controls, and this workflow runs on every push.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo clippy --version
      - run: cargo fmt --all --check
      # `--workspace` since milestone 4: the export boundary lives in a second
      # crate, and a gate that stopped at the package in the current directory
      # would have stopped watching the one file in this repository that
      # `unsafe_code = "forbid"` does not cover.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The test runner is deliberately not pinned: `stable` is what a reader will
  # have. 1.74.0 runs the same suite so that rust-version in Cargo.toml is a
  # verified claim rather than an asserted one.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, 1.74.0]
    steps:
      # Pinned to a commit, not a tag: a tag is a moving pointer someone
      # else controls, and this workflow runs on every push.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc --version
      - run: cargo test --workspace --no-fail-fast
      # Fixtures are byte-exact evidence. If a checkout ever translates their
      # line endings, b08_crlf silently stops testing CRLF and starts testing
      # whatever the platform produced. This is the check that says so.
      - name: The CRLF fixtures still contain CRLF
        shell: bash
        run: |
          for fixture in tests/fixtures/b08_crlf.lrat tests/fixtures/b30_crlf.drat; do
            if ! grep -qU $'\r' "$fixture"; then
              echo "$fixture has lost its CRLF line endings" >&2
              exit 1
            fi
          done

  # The module the playground will load. Built in CI so that a change which
  # compiles for the host but not for wasm32 is caught by the push that made
  # it, rather than by whoever next tries to publish a page.
  #
  # `std` for wasm32-unknown-unknown is a rustup component rather than part of
  # the toolchain, so this job installs the target explicitly. Both toolchains
  # build it, which is what keeps `rust-version` a claim about the whole
  # workspace and not only about the part of it that runs on a desktop.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.74.0]
    steps:
      # Pinned to a commit, not a tag: a tag is a moving pointer someone
      # else controls, and this workflow runs on every push.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install ${{ matrix.toolchain }} with the wasm32 target
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal \
            --target wasm32-unknown-unknown
          rustup default ${{ matrix.toolchain }}
          rustc --version
      - run: cargo build --profile release-wasm --target wasm32-unknown-unknown -p refute-wasm
      # Three exports, one memory, and no imports whatsoever. The last is the
      # mechanism behind the playground's privacy claim, and a mechanism is
      # worth asserting where a promise is not.
      - run: node tools/wasm_shape.mjs
      # The native checker, to compare the module against. Debug rather than
      # release: a verdict that depended on the optimisation level would be a
      # far more interesting failure than a slow one.
      - run: cargo build
      # The only test in this milestone that really matters. Every committed
      # fixture pair, through the module and through the binary, verdict against
      # verdict. Not --quiet: the table is the evidence, and a tick is not.
      - run: node tools/wasm_agreement.mjs
