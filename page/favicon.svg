<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Refute">
  <!-- Falsum. A refutation is a derivation of it, and this project checks
       derivations of it. Same-origin and committed, like everything else this
       page loads: a favicon from a data: URI would have meant widening the
       Content-Security-Policy, and a 404 in the network tab of a page whose
       pitch is "open the network tab" is not much better. -->
  <rect width="32" height="32" rx="5" fill="#1d4f3f" />
  <rect x="14.5" y="7" width="3" height="14" fill="#fbfbf9" />
  <rect x="7" y="21" width="18" height="3" fill="#fbfbf9" />
</svg>
